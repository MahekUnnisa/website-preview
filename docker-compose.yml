services:
  zeroai-website:
    image: 125250329638.dkr.ecr.ap-southeast-1.amazonaws.com/zeroai/website:latest
    container_name: zeroai-website
    ports:
      - "${ZEROAI_PORT:-3000}:80"
    restart: unless-stopped
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

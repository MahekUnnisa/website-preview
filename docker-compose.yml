services:
  zeroai-website:
    image: 125250329638.dkr.ecr.ap-southeast-1.amazonaws.com/zeroai/website:latest
    container_name: zeroai-website
    ports:
      - "${ZEROAI_PORT:-3001}:80"
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/v2}
      VITE_EXTENSION_ID: ${VITE_EXTENSION_ID:-}
      VITE_CHROME_WEBSTORE_URL: ${VITE_CHROME_WEBSTORE_URL:-}

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
